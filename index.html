<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta property="og:title" content="Dos Fuegos — Menú del Día"/>
<meta property="og:description" content="Sábado 6 de junio 2026 · Dos dragones, un sabor brutal 🔥"/>
<title>Dos Fuegos — Menú del Día</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#F0F2F5;color:#2D3436;font-family:'DM Sans',sans-serif;min-height:100vh;}
.hero{width:100%;display:block;border-radius:0 0 20px 20px;box-shadow:0 4px 20px rgba(45,52,54,0.15);}
.quick-order{background:#FFFFFF;margin:14px;border-radius:16px;padding:16px;box-shadow:0 2px 12px rgba(45,52,54,0.08);}
.quick-title{font-family:'Playfair Display',serif;font-size:16px;color:#2D3436;margin-bottom:12px;text-align:center;}
.quick-title span{color:#E17055;}
.platos-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.plato-mini{border-radius:12px;padding:12px;text-align:center;}
.plato-mini.p1{background:linear-gradient(135deg,rgba(225,112,85,0.08),rgba(214,48,49,0.05));border:1.5px solid rgba(225,112,85,0.2);}
.plato-mini.p2{background:linear-gradient(135deg,rgba(9,132,227,0.08),rgba(108,92,231,0.05));border:1.5px solid rgba(9,132,227,0.2);}
.plato-mini-nombre{font-size:11px;font-weight:700;color:#2D3436;line-height:1.3;margin-bottom:6px;}
.plato-mini-precio{font-family:'Playfair Display',serif;font-size:20px;font-weight:900;}
.plato-mini.p1 .plato-mini-precio{color:#E17055;}
.plato-mini.p2 .plato-mini-precio{color:#0984E3;}
.wa-btn{display:flex;align-items:center;justify-content:center;gap:11px;width:100%;padding:16px;background:linear-gradient(135deg,#25D366,#128C7E);border:none;border-radius:14px;color:#fff;font-size:15px;font-weight:700;font-family:'DM Sans',sans-serif;text-decoration:none;box-shadow:0 4px 16px rgba(37,211,102,0.3);}
.wa-btn svg{width:22px;height:22px;fill:#fff;flex-shrink:0;}
.header{background:#FFFFFF;padding:22px 20px 18px;text-align:center;box-shadow:0 2px 12px rgba(45,52,54,0.08);position:relative;}
.header::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#E17055,#D63031,#E17055);}
.header img{width:60px;height:60px;border-radius:50%;border:2px solid #E17055;object-fit:cover;margin-bottom:10px;}
.header h1{font-family:'Playfair Display',serif;font-size:22px;color:#2D3436;}
.header .tagline{font-size:12px;color:#636E72;margin-top:3px;}
.fecha-badge{display:inline-block;background:rgba(225,112,85,0.08);border:1.5px solid rgba(225,112,85,0.3);border-radius:20px;padding:5px 14px;font-size:11px;font-weight:700;color:#E17055;margin-top:10px;text-transform:uppercase;letter-spacing:.8px;}
.info-bar{background:#FFFFFF;margin:10px 14px 0;border-radius:14px;padding:11px 14px;box-shadow:0 2px 8px rgba(45,52,54,0.06);display:flex;justify-content:space-around;flex-wrap:wrap;gap:6px;}
.info-item{display:flex;align-items:center;gap:6px;font-size:11px;color:#636E72;}
.info-item .val{font-weight:700;color:#2D3436;}
.info-dot{width:5px;height:5px;border-radius:50%;background:#E17055;flex-shrink:0;}
.section-header{padding:18px 14px 10px;display:flex;align-items:center;gap:10px;}
.section-header h2{font-family:'Playfair Display',serif;font-size:17px;color:#2D3436;}
.section-line{flex:1;height:1.5px;background:linear-gradient(90deg,#DFE6E9,transparent);}
.plato-card{background:#FFFFFF;border-radius:16px;margin:0 14px 14px;overflow:hidden;box-shadow:0 2px 12px rgba(45,52,54,0.07);}
.plato-accent{height:5px;}
.plato-body{padding:16px;}
.plato-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px;}
.plato-nombre{font-family:'Playfair Display',serif;font-size:17px;color:#2D3436;line-height:1.3;flex:1;}
.plato-precio-badge{background:linear-gradient(135deg,#E17055,#D63031);color:#fff;border-radius:10px;padding:6px 12px;font-size:15px;font-weight:700;white-space:nowrap;box-shadow:0 3px 10px rgba(225,112,85,0.35);flex-shrink:0;}
.plato-desc{font-size:12px;color:#636E72;line-height:1.6;margin-bottom:10px;}
.plato-tag{display:inline-flex;align-items:center;gap:5px;background:#F0F2F5;border-radius:8px;padding:4px 9px;font-size:11px;font-weight:600;color:#636E72;margin-right:5px;margin-bottom:4px;}
.wa-section{padding:6px 14px 18px;}
.footer{background:#FFFFFF;margin:8px 14px 20px;border-radius:16px;padding:16px;box-shadow:0 2px 8px rgba(45,52,54,0.06);text-align:center;}
.footer-top{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px;}
.footer-top img{width:38px;height:38px;border-radius:50%;border:2px solid #E17055;object-fit:cover;}
.footer-name{font-family:'Playfair Display',serif;font-size:14px;color:#2D3436;}
.footer-sub{font-size:10px;color:#B2BEC3;}
.divider{width:36px;height:2px;background:linear-gradient(90deg,#E17055,#D63031);border-radius:2px;margin:8px auto;}
.footer-info{font-size:11px;color:#636E72;line-height:1.8;}
.ig-link{display:inline-flex;align-items:center;gap:6px;margin-top:8px;color:#E17055;font-size:11px;font-weight:600;text-decoration:none;}
</style>
  
</head>
